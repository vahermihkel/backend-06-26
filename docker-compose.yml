services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: veebipood
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - /var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - "6380:6379"

  frontend:
    build:
      context: ../frontend0626
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../frontend0626:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - app

  app:
    image: veebipood
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/veebipood
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - db
      - redis
